version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - needs-compatibility-check
    # Hold paperweight and the Gradle wrapper until the combined bump and
    # build-script migration lands (see #21). Remove once that PR merges.
    ignore:
      - dependency-name: "io.papermc.paperweight.patcher"
      - dependency-name: "io.papermc.paperweight.patcher:io.papermc.paperweight.patcher.gradle.plugin"
      # Wrapper updates come through this gradle entry as "gradle-wrapper" (see #20).
      - dependency-name: "gradle-wrapper"
        versions: [">= 9.7.1"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
