# Palladium high-player profile: ~500 players, 32 GB RAM, 16+ fast cores, behind Velocity.
# Merge these keys into your server.properties; keys not listed keep their current value.
# See docs/palladium/performance-profiles.md. [B] = changes gameplay or plugin-visible behaviour.

max-players=500
# [B] Chunks sent to clients (vanilla 10). Loaded chunks, chunk sends and the entity
# tracker all scale with this per player.
view-distance=8
# [B] Chunks where entities, crops and redstone tick (vanilla 10).
simulation-distance=5
# [B] Scales every entity-tracking-range (percent). Fewer tracker pairs and move packets.
entity-broadcast-range-percentage=75
# Behind a proxy, use the same threshold as the proxy (Velocity default 256).
network-compression-threshold=256
