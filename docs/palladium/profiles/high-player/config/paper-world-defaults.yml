# Palladium high-player profile overlay for config/paper-world-defaults.yml. Merge into the existing file.
# [B] = changes gameplay or plugin-visible behaviour.

chunks:
  # [B] Players moving into unloaded chunks are pushed back instead of loading them synchronously.
  prevent-moving-into-unloaded-chunks: true
  # [B] Cap how many of these entities a chunk saves (stops lag-machine buildup).
  entity-per-chunk-save-limit:
    experience_orb: 16
    arrow: 16
    snowball: 8
    ender_pearl: 8
    fireball: 8
    small_fireball: 8
collisions:
  # [B] Vanilla-ish cramming checks fewer neighbours (default 8).
  max-entity-collisions: 4
entities:
  spawning:
    # [B] Hostile mobs despawn closer to players (vanilla soft 32 / hard 128).
    despawn-ranges:
      monster:
        soft: 28
        hard: 96
  armor-stands:
    # [B] Armor stands stop looking up entity collisions every tick.
    do-collision-entity-lookups: false
environment:
  # [B] Cache explosion block density (Paper); results can differ slightly from vanilla.
  optimize-explosions: true
tick-rates:
  # [B] Grass/mycelium spread and spawner checks run less often.
  grass-spread: 4
  mob-spawner: 2
# Optional, [B]: alternate-current redstone is far cheaper but changes update order.
# misc:
#   redstone-implementation: ALTERNATE_CURRENT
# Optional, [B]: only if no plugin listens for InventoryMoveItemEvent.
# hopper:
#   disable-move-event: true
