# Palladium low-end profile: 1-2 vCPU, 2-4 GB RAM, up to ~10 players.
# Merge these keys into your server.properties; keys not listed keep their current value.
# See docs/palladium/performance-profiles.md. [B] = changes gameplay or plugin-visible behaviour.

# [B] Chunks sent to clients (vanilla 10). Biggest single memory and chunk-IO lever.
view-distance=6
# [B] Chunks where entities, crops and redstone tick (vanilla 10).
simulation-distance=4
# [B] Stop ticking worlds after 60s with nobody online (vanilla default; Paper ships -1).
# Leave at -1 if a plugin needs worlds to keep ticking while the server is empty.
pause-when-empty-seconds=60
